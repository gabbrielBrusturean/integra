spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:integra}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:casca236}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  reminders:
    enabled: ${REMINDERS_ENABLED:true}
    cron: ${REMINDERS_CRON:0 0 9 * * *}
    from: ${MAIL_FROM:${MAIL_USERNAME:notifications@integra.local}}

server:
  servlet:
    context-path: /api
