# Development Profile - Uses H2 In-Memory Database
spring:
  datasource:
    url: jdbc:h2:mem:integra
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
      format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

logging:
  level:
    root: INFO
    integra.backend: DEBUG
